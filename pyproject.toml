[project]
name = "obscura-cookie-manager"
version = "0.1.0"
description = "Shared cookie refresh mechanism for CLI tools with automatic validation, browser extraction, and multi-source storage"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "browser-cookie3>=0.10.0",
    "cryptography>=42.0.0",
]

[project.urls]
Homepage = "https://github.com/ishan-parihar/obscura-cookie-manager"
Repository = "https://github.com/ishan-parihar/obscura-cookie-manager"
Issues = "https://github.com/ishan-parihar/obscura-cookie-manager/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]