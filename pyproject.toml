[project]
name = "obscura-cookie-manager"
version = "0.1.0"
description = "Shared cookie refresh mechanism for CLI tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "browser-cookie3>=0.10.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]